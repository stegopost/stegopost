<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>钥匙台</title>
<style>
  :root{--bd:#d8dde3;--fg:#1c2024;--mut:#5b6672;--bg:#fff;--pri:#2b6cb0;--ok:#1a7f37;--warn:#a76a00;--warnbg:#fff8c5;--warnbd:#d4a72c}
  @media (prefers-color-scheme:dark){
    :root{--bd:#333b44;--fg:#e6e9ed;--mut:#9aa5b1;--bg:#14181c;--pri:#4d8fd0;--ok:#4ac26b;--warn:#e3b341;--warnbg:#2a2410;--warnbd:#5c4a1a}
  }
  *{box-sizing:border-box}
  body{margin:0;padding:20px 16px 44px;background:var(--bg);color:var(--fg);
       font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
       max-width:560px;margin-left:auto;margin-right:auto}
  h1{font-size:20px;margin:0 0 6px}
  .sub{color:var(--mut);font-size:13px;margin:0 0 18px}
  label{display:block;font-size:13px;color:var(--mut);margin:16px 0 6px}
  input{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;
        background:transparent;color:var(--fg);font-size:16px;font-family:inherit}
  textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:8px;
           background:transparent;color:var(--fg);font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
           letter-spacing:.2px;resize:vertical;word-break:break-all}
  button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:8px;background:var(--pri);
         color:#fff;font-size:16px;font-weight:600;font-family:inherit}
  button:active{opacity:.85}
  .out{margin-top:18px;display:none}
  .out.on{display:block}
  .tip{font-size:12px;color:var(--mut);margin:8px 0 0}
  .warn{font-size:13px;color:var(--warn);background:var(--warnbg);border:1px solid var(--warnbd);
        padding:10px 12px;border-radius:8px;margin:16px 0 0}
  .cp{margin-top:8px;width:auto;padding:9px 14px;font-size:14px}
  .done{color:var(--ok);font-size:13px;margin-left:10px}
  .ck{display:flex;align-items:center;gap:8px;margin:14px 0 0;font-size:13px;color:var(--mut)}
  .ck input{width:auto;margin:0}
  .step{margin:22px 0 0;padding:14px 16px;border:1px solid var(--bd);border-radius:10px}
  .step h2{font-size:14px;margin:0 0 8px}
  .step p{margin:0 0 6px;font-size:13px;color:var(--mut)}
  a{color:var(--pri)}
  code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:rgba(128,128,128,.14);
       padding:1px 5px;border-radius:4px;word-break:break-all}
</style>
</head>
<body>

<h1>钥匙台</h1>
<p class="sub">猜到答案了？在这儿把它转成插件要的那一串。</p>

<label for="p">① 那句话</label>
<input id="p" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
       placeholder="群里给的那一串，原样粘进来">

<label for="a">② 你猜到的答案</label>
<input id="a" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false"
       placeholder="原样打，不加标点不加空格">

<label class="ck"><input type="checkbox" id="rm" checked><span>这台设备记着那句话，下次不用再填</span></label>

<button id="go">转成钥匙</button>

<div class="out" id="out">
  <label for="r">转出来的一串（整段复制）</label>
  <textarea id="r" rows="3" readonly></textarea>
  <button class="cp" id="cp">复制</button><span class="done" id="dn"></span>
  <p class="tip">粘到插件第一道门那个框里。这一串是 64 位十六进制，注意别少复制一位。</p>
</div>

<p class="warn" id="err" style="display:none"></p>

<div class="step">
  <h2>然后三步</h2>
  <p>1. 转出来的那一串 → 复制。</p>
  <p>2. 装插件（装了跳过）：<a id="ins" href="https://stegopost.github.io/stegopost/" target="_blank" rel="noopener">打开安装页</a></p>
  <p>3. 插件弹第一道门 → 把那一串粘进去 → 开门。</p>
</div>

<p class="tip" style="margin-top:22px">
  这个页不联网、不请求任何外部资源，填的东西一个字节都不会发出去；存成文件断网也能用。<br>
  那句话只保存在你自己的浏览器里（上面的勾去掉就一次也不存）。页面本身**不含**那句话 ——
  所以把这个网址发给谁都行，没有那句话的人转不出钥匙。
</p>

<script>
/* SHA-256 + HMAC（RFC 6234 / RFC 2104），纯 JS —— 只为了在 file:// 和老浏览器上也能跑。
   新浏览器走上面那条 WebCrypto 快路，这段等于备用。 */
var K256 = new Uint32Array([
0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,
0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,
0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,
0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,
0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,
0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,
0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,
0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2]);

function sha256(bytes) {
  var H = new Uint32Array([0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,
                           0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19]);
  var len = bytes.length, bits = len * 8;
  var padded = new Uint8Array((((len + 8) >> 6) + 1) << 6);
  padded.set(bytes);
  padded[len] = 0x80;
  var dv = new DataView(padded.buffer);
  dv.setUint32(padded.length - 8, Math.floor(bits / 4294967296));
  dv.setUint32(padded.length - 4, bits >>> 0);
  var W = new Uint32Array(64), i, off;
  for (off = 0; off < padded.length; off += 64) {
    for (i = 0; i < 16; i++) W[i] = dv.getUint32(off + i * 4);
    for (i = 16; i < 64; i++) {
      var w15 = W[i - 15], w2 = W[i - 2];
      var s0 = ((w15 >>> 7) | (w15 << 25)) ^ ((w15 >>> 18) | (w15 << 14)) ^ (w15 >>> 3);
      var s1 = ((w2 >>> 17) | (w2 << 15)) ^ ((w2 >>> 19) | (w2 << 13)) ^ (w2 >>> 10);
      W[i] = (W[i - 16] + s0 + W[i - 7] + s1) >>> 0;
    }
    var a = H[0], b = H[1], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7];
    for (i = 0; i < 64; i++) {
      var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
      var ch = (e & f) ^ (~e & g);
      var t1 = (h + S1 + ch + K256[i] + W[i]) >>> 0;
      var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
      var mj = (a & b) ^ (a & c) ^ (b & c);
      var t2 = (S0 + mj) >>> 0;
      h = g; g = f; f = e; e = (d + t1) >>> 0;
      d = c; c = b; b = a; a = (t1 + t2) >>> 0;
    }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0;
    H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0;
    H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0;
    H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0;
  }
  var out = new Uint8Array(32), odv = new DataView(out.buffer);
  for (i = 0; i < 8; i++) odv.setUint32(i * 4, H[i]);
  return out;
}
function utf8(s) {
  if (typeof TextEncoder !== "undefined") return new TextEncoder().encode(s);
  var esc = unescape(encodeURIComponent(s)), u = new Uint8Array(esc.length), i;
  for (i = 0; i < esc.length; i++) u[i] = esc.charCodeAt(i);
  return u;
}
function hexStr(u) {
  var s = "", i;
  for (i = 0; i < u.length; i++) s += (u[i] < 16 ? "0" : "") + u[i].toString(16);
  return s;
}
function hmacSync(keyStr, msgStr) {
  var BLK = 64, i;
  var k = utf8(keyStr);
  if (k.length > BLK) k = sha256(k);
  var pad = new Uint8Array(BLK); pad.set(k);
  var ipad = new Uint8Array(BLK), opad = new Uint8Array(BLK);
  for (i = 0; i < BLK; i++) { ipad[i] = pad[i] ^ 0x36; opad[i] = pad[i] ^ 0x5c; }
  var msg = utf8(msgStr);
  var inner = new Uint8Array(BLK + msg.length);
  inner.set(ipad); inner.set(msg, BLK);
  var ih = sha256(inner);
  var outer = new Uint8Array(BLK + 32);
  outer.set(opad); outer.set(ih, BLK);
  return hexStr(sha256(outer));
}
/** WebCrypto 能算就用它（快、且和插件 loader 用的是同一套），否则退回纯 JS */
function hmac(keyStr, msgStr, cb) {
  try {
    if (typeof crypto !== "undefined" && crypto.subtle && crypto.subtle.importKey) {
      crypto.subtle.importKey("raw", utf8(keyStr), { name: "HMAC", hash: "SHA-256" }, false, ["sign"])
        .then(function (k) { return crypto.subtle.sign("HMAC", k, utf8(msgStr)); })
        .then(function (b) { cb(null, hexStr(new Uint8Array(b))); })
        .catch(function () { cb(null, hmacSync(keyStr, msgStr)); });
      return;
    }
  } catch (e) {}
  cb(null, hmacSync(keyStr, msgStr));
}

(function () {
  var P = document.getElementById("p"), A = document.getElementById("a");
  var out = document.getElementById("out"), R = document.getElementById("r");
  var err = document.getElementById("err"), cp = document.getElementById("cp");
  var dn = document.getElementById("dn"), rm = document.getElementById("rm");
  var PK = "stegopost.k.ph.v1";

  function trim(s) {
    return String(s || "").replace(/^[\s\u200b-\u200d\ufeff]+|[\s\u200b-\u200d\ufeff]+$/g, "");
  }
  function bad(t) { err.textContent = t; err.style.display = "block"; out.classList.remove("on"); }

  // 上次那句话（勾着才读）
  try {
    var saved = localStorage.getItem(PK);
    if (saved) { P.value = saved; }
    else { rm.checked = false; }
  } catch (e) { rm.checked = false; }
  // 也支持 #p=xxxx 带过来（方便对方用手指点一下就带着那句话）
  try {
    var m = /[#&]p=([^&]+)/.exec(location.hash || "");
    if (m) { P.value = decodeURIComponent(m[1]); rm.checked = false; }
  } catch (e) {}

  document.getElementById("go").addEventListener("click", function () {
    dn.textContent = "";
    var ph = trim(P.value), an = trim(A.value);
    if (!ph) { return bad("先填第 ① 格：那句话。"); }
    if (!an) { return bad("先填第 ② 格：你猜到的答案。"); }
    err.style.display = "none";
    try {
      if (rm.checked) localStorage.setItem(PK, ph);
      else localStorage.removeItem(PK);
    } catch (e) {}
    hmac(ph, an, function (e2, hex) {
      R.value = hex;
      out.classList.add("on");
      try { R.scrollIntoView({ block: "center", behavior: "smooth" }); } catch (e3) {}
    });
  });
  A.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { e.preventDefault(); document.getElementById("go").click(); }
  });

  cp.addEventListener("click", function () {
    R.select();
    try { R.setSelectionRange(0, R.value.length); } catch (e) {}
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(R.value).then(function () { dn.textContent = "已复制"; },
          function () { dn.textContent = "长按手动复制"; });
      } else { document.execCommand("copy"); dn.textContent = "已复制"; }
    } catch (e) { dn.textContent = "长按手动复制"; }
  });
})();
</script>
</body>
</html>
